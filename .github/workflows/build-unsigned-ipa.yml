name: Build unsigned IPA

# Builds an *unsigned* .ipa on a GitHub-hosted macOS runner, for people without a Mac.
# The IPA is then signed on Windows with Sideloadly (free or paid Apple ID) and installed
# over USB. No Apple Developer account or signing secrets are needed for this workflow.
#
# Notes:
# - BUILTIN_VPN=NO produces the free-Apple-ID variant (no Network Extension entitlement);
#   that variant needs the LocalDevVPN app from the App Store at run time.
# - The device-only build is arm64; the Rust static library is built by scripts/build-idevice.sh.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -E '^Xcode' || true
          rustc --version
          cargo --version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Add Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Build idevice static library
        # bash (not ./) so a checkout without the exec bit still works
        run: bash scripts/build-idevice.sh

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project iPhoneUse.xcodeproj \
            -scheme iPhoneUse \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILTIN_VPN=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/iPhoneUse.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          rm -rf Payload iphone-use-app-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload iphone-use-app-unsigned.ipa
          shasum -a 256 iphone-use-app-unsigned.ipa | tee sha256.txt
          ls -lh iphone-use-app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-use-app-unsigned-ipa
          path: |
            iphone-use-app-unsigned.ipa
            sha256.txt
          if-no-files-found: error
